# Built with Zensical, which reads this MkDocs-format config as-is (ADR 0003).
site_name: A File-First Operating Model for Claude Code
site_description: A file-first Claude Code operating model for solo developers and small teams.
repo_url: https://github.com/tcrossland/claude-code-methodology
repo_name: tcrossland/claude-code-methodology

# The existing docs/ tree is the source — rendered, not restructured (ADR 0002).
docs_dir: docs

# Working artefacts that are not published reference.
exclude_docs: |
  backlog.md
  style.md
  plans/
  design/
  local/

theme:
  name: material
  variant: modern
  palette:
    # Starts by following the system preference; the header toggle cycles system, light, dark.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: lucide/moon
        name: Switch to system preference
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.highlight
    - search.suggest

nav:
  - Home: index.md
  - Methodology: methodology.md
  - Worked example: worked-example.md
  - Appendices:
      - Overview: appendices/README.md
      - Subagents: appendices/subagents.md
      - Hooks: appendices/hooks.md
      - Document skeletons: appendices/skeletons.md
      - Skills & commands: appendices/skills-and-commands.md
  - Packaging as a plugin: packaging-as-a-plugin.md

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details

# Link checking: Zensical warns by default on a link to a missing page or anchor, and CI runs
# `zensical build --strict`, which fails the build on any warning (ADR 0003). A plain local
# `zensical serve` or `build` only warns. The one illustrative dangling link in
# docs/worked-example.md sits inside a code fence, so it is never parsed.
