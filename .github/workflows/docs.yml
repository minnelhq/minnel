name: docs

# Build and validate the doc site with Zensical (ADR 0003) on every PR and every push to main.
# The site is published on GitHub Pages (Source: GitHub Actions), but only by a manual run: a
# push to main builds without deploying, so the live site lags main until someone runs this. To
# auto-deploy instead, drop the `workflow_dispatch` gates on the upload step and deploy job.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Avoid concurrent Pages deploys clobbering each other (matters once deploy is push-triggered).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs (immutable); version in the trailing comment.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.x'
      - run: pip install -r requirements.txt
      # --strict fails the build on any warning, including a link to a missing page or anchor.
      - run: zensical build --strict --clean
      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    # Gated: manual runs only (ADR 0003).
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
