name: docs

# Build and validate the doc site with Zensical (ADR 0003) on every PR and every push to main.
# Every push to main also deploys it to GitHub Pages (Source: GitHub Actions), as does a manual
# run on main; a pull request or a run on another branch only builds (ADR 0005). The github-pages
# environment also accepts deploys from main only.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Deploying runs share the `pages` group, so pushes to main deploy one at a time and in order; a
# newer pending run replaces an older one. Every other run gets a group of its own, so a PR build
# can't queue in `pages` and cancel a pending deploy.
concurrency:
  group: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && 'pages' || format('docs-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs (immutable); version in the trailing comment.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.x'
      - run: pip install -r requirements.txt
      # --strict fails the build on any warning, including a link to a missing page or anchor.
      - run: zensical build --strict --clean
      # The site self-hosts mermaid.js (ADR 0006). Zensical's bundle fetches it from unpkg when a
      # page draws a diagram without loading the vendored copy, so fail on such a page, and on a
      # vendored major that no longer matches the one the bundle would fetch.
      - name: Check diagrams load the vendored Mermaid
        run: |
          fail=0
          for f in $(grep -rl --include='*.html' 'class="mermaid"' site); do
            grep -q 'assets/vendor/mermaid-[0-9.]*/mermaid.min.js' "$f" ||
              { echo "::error file=$f::draws a diagram without the vendored mermaid.js"; fail=1; }
          done
          want=$(grep -oh 'unpkg.com/mermaid@[0-9]*' site/assets/javascripts/bundle.*.js | head -n 1 | sed 's/.*@//')
          have=$(ls -d docs/assets/vendor/mermaid-* | sed 's/.*mermaid-//; s/\..*//')
          [ -n "$want" ] && [ "$want" = "$have" ] ||
            { echo "::error::the bundle's fallback is mermaid@${want:-?}; the vendored copy is ${have}.x"; fail=1; }
          exit $fail
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    # Pushes to main and manual runs on main only (ADR 0005).
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
